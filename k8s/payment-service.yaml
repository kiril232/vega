apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: vega
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: kiril232/vega-payment-service:f570138ca1689813d077984b71ed14b0d3a4c66e
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: vega-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: vega
spec:
  selector:
    app: payment-service
  ports:
    - port: 8080
      targetPort: 8080